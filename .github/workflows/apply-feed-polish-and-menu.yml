name: Apply Feed Polish And Menu

on:
  push:
    branches: [feature/social-reactions-v1]
    paths: [.github/workflows/apply-feed-polish-and-menu.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-reactions-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Patch Facebook-style feed UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('components/social/SocialFeedScreen.tsx')
          text = path.read_text()

          # imports
          if '  Menu,\n' not in text:
              text = text.replace('  MapPin,\n', '  MapPin,\n  Menu,\n', 1)
          if 'CommentThread' not in text:
              text = text.replace(
                  'import { PostReactions } from "@/components/social/PostReactions";\n',
                  'import { PostReactions } from "@/components/social/PostReactions";\nimport { CommentThread } from "@/components/social/CommentThread";\nimport { MobileMenuDrawer } from "@/components/social/MobileMenuDrawer";\n',
                  1,
              )

          # replace header function entirely
          header_pattern = re.compile(r'function SocialHeader\(.*?\n\}\n\nexport function SocialFeedScreen', re.S)
          header = '''function SocialHeader({
  visible,
  onMenu,
}: {
  visible: boolean;
  onMenu: () => void;
}) {
  return (
    <header
      className={`sticky top-0 z-[80] border-b border-slate-200 bg-white/95 backdrop-blur transition-transform duration-200 ease-out ${
        visible ? "translate-y-0" : "-translate-y-full"
      }`}
    >
      <div className="mx-auto flex h-[58px] max-w-[1380px] items-center justify-end gap-2 px-3 sm:px-5">
        <Link
          href="/notifications"
          aria-label="Notifications"
          className="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100"
        >
          <Bell className="h-5 w-5" />
        </Link>
        <button
          type="button"
          aria-label="Open menu"
          onClick={onMenu}
          className="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100"
        >
          <Menu className="h-6 w-6" />
        </button>
      </div>
    </header>
  );
}

export function SocialFeedScreen'''
          if header_pattern.search(text):
              text = header_pattern.sub(header, text, count=1)
          else:
              raise SystemExit('header function anchor not found')

          # smart header scroll state
          state_anchor = '  const [contactLoading, setContactLoading] = useState(false);\n'
          if 'headerVisible' not in text:
              text = text.replace(
                  state_anchor,
                  state_anchor + '  const [headerVisible, setHeaderVisible] = useState(true);\n  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);\n  const lastScrollY = useRef(0);\n',
                  1,
              )

          auth_effect = '''  useEffect(() => {
    if (isLoaded && !user) {
      router.replace("/auth/login?redirect=%2Ffeed");
    }
  }, [isLoaded, router, user]);
'''
          if 'const handleScroll = () =>' not in text:
              scroll_effect = auth_effect + '''
  useEffect(() => {
    const handleScroll = () => {
      const currentY = Math.max(0, window.scrollY);
      const delta = currentY - lastScrollY.current;
      if (currentY < 20) setHeaderVisible(true);
      else if (delta > 8) setHeaderVisible(false);
      else if (delta < -6) setHeaderVisible(true);
      lastScrollY.current = currentY;
    };
    lastScrollY.current = window.scrollY;
    window.addEventListener("scroll", handleScroll, { passive: true });
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);
'''
              text = text.replace(auth_effect, scroll_effect, 1)

          # replace all old header invocations
          text = re.sub(
              r'<SocialHeader[^>]*/>',
              '<SocialHeader visible={headerVisible} onMenu={() => setMobileMenuOpen(true)} />',
              text,
          )

          # insert drawer once after first header invocation inside main render
          render_header = '<SocialHeader visible={headerVisible} onMenu={() => setMobileMenuOpen(true)} />'
          drawer = render_header + '''
      <MobileMenuDrawer
        open={mobileMenuOpen}
        onClose={() => setMobileMenuOpen(false)}
        userName={user?.name}
      />'''
          if '<MobileMenuDrawer' not in text:
              text = text.replace(render_header, drawer, 1)

          # Facebook-like text sizing and density in post cards
          text = text.replace(
              'className="font-bold">\n            {post.author.name}',
              'className="text-[15px] font-semibold leading-tight">\n            {post.author.name}',
              1,
          )
          text = text.replace(
              'className="flex items-center gap-1 text-xs text-slate-500">\n            {ago(post.createdAt)}',
              'className="mt-0.5 flex items-center gap-1 text-[12px] font-medium leading-tight text-slate-500">\n            {ago(post.createdAt)}',
              1,
          )
          text = text.replace(
              'className="whitespace-pre-wrap px-4 pb-3 text-[15px]"',
              'className="whitespace-pre-wrap px-4 pb-3 text-[16px] font-normal leading-[1.35] text-slate-950"',
              1,
          )
          text = text.replace(
              '<article className="border-y bg-white shadow-sm sm:rounded-xl sm:border">',
              '<article className="border-y bg-white font-sans text-slate-950 shadow-sm sm:rounded-xl sm:border">',
              1,
          )

          # clean reaction indentation
          text = re.sub(
              r'      <PostReactions\n      postId=\{post.id\}\n      currentUserId=\{currentUserId\}\n      initialLikeCount=\{post.likeCount\}\n      initialLiked=\{post.likedByMe\}\n      commentCount=\{post.commentCount\}\n      shareCount=\{post.shareCount\}\n      onToggleComments=\{onToggleComments\}\n      onShare=\{onShare\}\n    />',
              '''      <PostReactions
        postId={post.id}
        currentUserId={currentUserId}
        initialLikeCount={post.likeCount}
        initialLiked={post.likedByMe}
        commentCount={post.commentCount}
        shareCount={post.shareCount}
        onToggleComments={onToggleComments}
        onShare={onShare}
      />''',
              text,
              count=1,
          )

          # replace bulky inline comments with compact threaded component
          comment_pattern = re.compile(
              r'      \{open && \(\n        <div className="border-t p-3">.*?\n        </div>\n      \)\}',
              re.S,
          )
          comment_replacement = '''      {open && (
        <CommentThread postId={post.id} currentUserId={currentUserId} />
      )}'''
          if comment_pattern.search(text):
              text = comment_pattern.sub(comment_replacement, text, count=1)
          else:
              raise SystemExit('comment block anchor not found')

          path.write_text(text)

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-feed-polish-and-menu.yml
          git config user.name "RoomKhoj Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/social http/services/social.service.ts .github/workflows/apply-feed-polish-and-menu.yml
          git commit -m "Polish social feed with smart header menu reactions and replies"
          git push origin HEAD:feature/social-reactions-v1
