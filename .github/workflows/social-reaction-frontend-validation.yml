name: Social Reaction Frontend Validation

on:
  pull_request:
    paths:
      - "components/social/**"
      - "http/services/social.service.ts"
      - ".github/workflows/social-reaction-frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
