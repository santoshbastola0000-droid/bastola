name: Temporary Public Copy Cleanup

on:
  push:
    branches:
      - fix/public-pages-brand-cleanup-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fix active RoomKhoj branding and fake contact success
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "lib/toast-texts.ts": [("RentalServise", "RoomKhoj")],
              "app/auth/register/page.tsx": [("RentalServise", "RoomKhoj")],
              "app/auth/verify/email/page.tsx": [("RentalServise", "RoomKhoj")],
              "components/admin/Sidebar.tsx": [("RentalServise", "RoomKhoj")],
              "components/home/why-choose-us.tsx": [("RoomServise", "RoomKhoj")],
              "components/home/cta-section.tsx": [("RoomServise", "RoomKhoj")],
              "app/contact/page.tsx": [("RoomServise", "RoomKhoj")],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text)

          contact = Path("app/contact/page.tsx")
          text = contact.read_text()
          start_marker = "    // Simulate API call"
          end_marker = "\n\n  // Type guard to check if contact info has action"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Contact fake-submit block was not found; refusing an unsafe partial patch")

          replacement = '''    toast.error("Online form delivery is not connected yet.", {
              description: "Please use the Call Us or Email Us option on this page.",
              icon: <AlertCircle className="w-4 h-4 text-amber-500" />,
              duration: 5000,
            });
            setSubmitting(false);
          };'''

          text = text[:start] + replacement + text[end:]
          text = text.replace("  CheckCircle,\n", "")
          contact.write_text(text)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/toast-texts.ts app/auth/register/page.tsx app/auth/verify/email/page.tsx components/admin/Sidebar.tsx components/home/why-choose-us.tsx components/home/cta-section.tsx app/contact/page.tsx
          git commit -m "Clean stale branding and contact form feedback"
          git push origin HEAD:fix/public-pages-brand-cleanup-20260909
