name: Apply Social Feed Final V2

on:
  push:
    branches: [feature/social-reactions-v1]
    paths: [.github/workflows/apply-social-feed-final-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-reactions-v1
          fetch-depth: 0

      - name: Add endless RoomKhoj service cards and clean stale workflow
        shell: python
        run: |
          from pathlib import Path

          svc = Path('http/services/social.service.ts')
          text = svc.read_text()
          story_anchor = '\nexport type SocialStory = {'
          if 'type: "SERVICE"' not in text:
              insertion = '''\n  | {\n      type: "SERVICE";\n      id: string;\n      createdAt: string;\n      service: {\n        key: string;\n        title: string;\n        body: string;\n        href: string;\n      };\n    };\n'''
              # SocialFeedItem currently closes with ; immediately before SocialStory.
              marker = '    };\n\nexport type SocialStory = {'
              if marker not in text:
                  raise SystemExit('SocialFeedItem end marker not found')
              text = text.replace(marker, '    }' + insertion + '\nexport type SocialStory = {', 1)
          svc.write_text(text)

          screen = Path('components/social/SocialFeedScreen.tsx')
          text = screen.read_text()
          render_anchor = '''          if (item.type === "ROOM") return <RoomCard key={`room-${item.id}`} item={item} />;\n          if (item.type === "JOB") return <JobCard key={`job-${item.id}`} item={item} />;\n          const post = item.post;'''
          render_repl = '''          if (item.type === "ROOM") return <RoomCard key={`room-${item.id}`} item={item} />;\n          if (item.type === "JOB") return <JobCard key={`job-${item.id}`} item={item} />;\n          if (item.type === "SERVICE") return <ServiceCard key={`service-${item.id}`} item={item} />;\n          const post = item.post;'''
          if 'return <ServiceCard' not in text:
              if render_anchor not in text:
                  raise SystemExit('feed render anchor not found')
              text = text.replace(render_anchor, render_repl, 1)

          story_viewer_anchor = '\nfunction StoryViewer({'
          if 'function ServiceCard(' not in text:
              card = '''\nfunction ServiceCard({ item }: { item: Extract<SocialFeedItem, { type: "SERVICE" }> }) {\n  return (\n    <Link\n      href={item.service.href}\n      className="block border-y bg-white p-4 shadow-sm sm:rounded-xl sm:border"\n    >\n      <div className="flex items-start gap-3">\n        <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-red-50 text-red-600">\n          <Plus className="h-6 w-6" />\n        </div>\n        <div className="min-w-0 flex-1">\n          <div className="text-[11px] font-bold uppercase tracking-wide text-red-600">RoomKhoj service</div>\n          <div className="mt-0.5 text-[16px] font-semibold leading-tight">{item.service.title}</div>\n          <p className="mt-1 text-[13px] leading-5 text-slate-600">{item.service.body}</p>\n          <div className="mt-2 text-[12px] font-bold text-red-600">Open →</div>\n        </div>\n      </div>\n    </Link>\n  );\n}\n'''
              if story_viewer_anchor not in text:
                  raise SystemExit('StoryViewer anchor not found')
              text = text.replace(story_viewer_anchor, card + story_viewer_anchor, 1)
          screen.write_text(text)

          stale = Path('.github/workflows/apply-endless-service-cards.yml')
          if stale.exists():
              stale.unlink()

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Commit verified frontend patch
        run: |
          rm .github/workflows/apply-social-feed-final-v2.yml
          git config user.name "RoomKhoj Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/social http/services app/notifications app/post .github/workflows
          git commit -m "Finish Facebook-style RoomKhoj social feed UX"
          git push origin HEAD:feature/social-reactions-v1
