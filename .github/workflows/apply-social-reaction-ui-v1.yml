name: Apply Social Reaction UI V1

on:
  push:
    branches:
      - feature/social-reactions-v1
    paths:
      - .github/workflows/apply-social-reaction-ui-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/social-reactions-v1
          fetch-depth: 0

      - name: Patch latest SocialFeedScreen
        shell: python
        run: |
          from pathlib import Path

          path = Path("components/social/SocialFeedScreen.tsx")
          text = path.read_text()

          import_anchor = '} from "@/http/services/social.service";'
          import_line = 'import { PostReactions } from "@/components/social/PostReactions";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("social import anchor missing")
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          post_card = text.index("function PostCard(")
          if "<PostReactions" not in text[post_card:]:
              start_anchor = '      <div className="flex justify-between px-4 py-2 text-sm text-slate-500">'
              start = text.index(start_anchor, post_card)
              end_anchor = "\n\n      {open && ("
              end = text.index(end_anchor, start)
              replacement = '''      <PostReactions
                postId={post.id}
                currentUserId={currentUserId}
                initialLikeCount={post.likeCount}
                initialLiked={post.likedByMe}
                commentCount={post.commentCount}
                shareCount={post.shareCount}
                onToggleComments={onToggleComments}
                onShare={onShare}
              />'''
              text = text[:start] + replacement + text[end:]

          marker = "  const own = post.author.id === currentUserId;"
          if "legacy callback retained" not in text:
              if marker not in text:
                  raise SystemExit("PostCard marker missing")
              text = text.replace(
                  marker,
                  marker + "\n  void onLike; // legacy callback retained while PostReactions owns reaction state",
                  1,
              )

          path.write_text(text)

      - name: Commit patched feed
        run: |
          git config user.name "RoomKhoj Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/social/SocialFeedScreen.tsx
          git commit -m "Integrate Facebook-style reactions into feed"
          git push origin HEAD:feature/social-reactions-v1
