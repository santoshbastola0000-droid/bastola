name: Chatbot Validation

on:
  pull_request:
  push:
    branches:
      - main
      - codex/ai-room-posting-ui

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-staff-tracking.cjs
      - run: node scripts/test-chatbot-voice-lifecycle.cjs
      - run: node scripts/test-owner-cost.cjs
      - run: node scripts/test-owner-voice.cjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
