name: Apply Feed Header Logo
on:
  push:
    branches: [feature/feed-header-logo]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Add RoomKhoj logo to feed header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/social/SocialFeedScreen.tsx')
          s = p.read_text()
          old = '''      <div className="mx-auto flex h-[58px] max-w-[760px] items-center justify-end gap-2 px-3">\n        <Link\n          href="/notifications"'''
          new = '''      <div className="mx-auto flex h-[58px] max-w-[760px] items-center gap-2 px-3">\n        <Link href="/feed" aria-label="RoomKhoj feed" className="mr-auto flex items-center">\n          <img\n            src="/roomkhoj-logo.png"\n            alt="RoomKhoj"\n            className="h-9 w-auto max-w-[150px] object-contain"\n          />\n        </Link>\n        <Link\n          href="/notifications"'''
          if old not in s:
              raise SystemExit('header target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Commit verified change
        run: |
          git config user.name "RoomKhoj Automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/social/SocialFeedScreen.tsx
          git commit -m "Add RoomKhoj logo to feed header" || exit 0
          git push
